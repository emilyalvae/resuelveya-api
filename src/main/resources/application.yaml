spring:
  application:
    name: resuelve-api

  profiles:
    active: local  # por defecto usas local


  jpa:
    #database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  management:
    endpoints:
      web:
        exposure:
          include: health,metrics
    endpoint:
      health:
        show-details:always



